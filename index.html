<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4d6">
  <meta name="description" content="Copy the picture as well as you can, watch the replay, get judged. Then turn your drawing into a sticker.">
  <title>Copy That!</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%E2%9C%8F%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/references.js" defer></script>
  <script src="js/fill.js" defer></script>
  <script src="js/strokes.js" defer></script>
  <script src="js/draw.js" defer></script>
  <script src="js/scoring.js" defer></script>
  <script src="js/verdicts.js" defer></script>
  <script src="js/export.js" defer></script>
  <script src="js/share.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-phase="drawing">
  <header class="top">
    <h1 class="logo">Copy <span>That!</span></h1>
  </header>

  <main class="stage">
    <section class="panel panel-ref" aria-label="Reference">
      <div class="panel-label">Copy this: <strong id="ref-name">…</strong></div>
      <div class="canvas-frame">
        <canvas id="ref-canvas" width="1024" height="1024" aria-label="Reference image"></canvas>
      </div>
    </section>

    <section class="panel panel-draw" aria-label="Your drawing">
      <div class="panel-label">
        Your masterpiece
        <span id="timer-pill" class="timer-pill" hidden>1:00</span>
      </div>
      <div class="canvas-frame">
        <canvas id="draw-canvas" width="1024" height="1024" data-tool="brush" aria-label="Drawing canvas"></canvas>
      </div>
    </section>

    <aside class="side">
      <!-- ===== drawing phase ===== -->
      <div class="toolbar phase-draw">
        <div class="tools">
          <div class="tool-group" role="radiogroup" aria-label="Tool">
            <button class="tool-btn" type="button" role="radio" data-tool="brush" aria-checked="true" title="Brush (B)" aria-label="Brush">
              <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>
            </button>
            <button class="tool-btn" type="button" role="radio" data-tool="eraser" aria-checked="false" title="Eraser (E)" aria-label="Eraser">
              <svg viewBox="0 0 24 24"><path d="M3 15l9-9 6 6-6 6H7z"/><path d="M8 11l6 6"/><path d="M13 21h8"/></svg>
            </button>
            <button class="tool-btn" type="button" role="radio" data-tool="fill" aria-checked="false" title="Fill (F)" aria-label="Fill bucket">
              <svg viewBox="0 0 24 24"><path d="M4 11l7-7 7 7-7 7z"/><path d="M4 11h14"/><path d="M20 15s2 2.6 2 4a2 2 0 0 1-4 0c0-1.4 2-4 2-4z"/></svg>
            </button>
          </div>
          <div class="tool-group">
            <button class="tool-btn" id="btn-undo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
              <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
            </button>
            <button class="tool-btn" id="btn-redo" type="button" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>
              <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
            </button>
            <button class="tool-btn" id="btn-clear" type="button" title="Clear" aria-label="Clear drawing" disabled>
              <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
            </button>
          </div>
        </div>
        <div class="sizes" id="sizes" role="radiogroup" aria-label="Brush size"></div>
        <div class="palette" id="palette" role="radiogroup" aria-label="Colour"></div>
      </div>

      <div class="actions phase-draw">
        <button id="btn-done" class="btn btn-primary" type="button" disabled title="Draw something first">Done!</button>
        <button id="btn-skip" class="btn btn-ghost" type="button">Skip ↻</button>
      </div>

      <div class="options phase-draw">
        <label class="chip timer-toggle">
          <input type="checkbox" id="timer-toggle">
          <span>⏱️ 60s timer</span>
        </label>
        <button id="btn-categories" class="chip" type="button" aria-haspopup="dialog">
          🗂️ Categories <span class="chip-count" id="cat-count">all</span>
        </button>
      </div>

      <!-- ===== replay phase ===== -->
      <div class="card phase-replay" aria-live="polite">
        <h2 class="card-title">Calculating similarity<span class="dots"><span>.</span><span>.</span><span>.</span></span></h2>
        <div class="progress" role="progressbar" aria-label="Calculating" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="calc-status" id="calc-status">Warming up the judges…</p>
        <button id="btn-skip-replay" class="link-btn" type="button">skip ▸</button>
      </div>

      <!-- ===== result phase ===== -->
      <div class="card phase-result" aria-live="polite">
        <div class="score-label">Similarity</div>
        <div class="score-row">
          <div class="score" id="score">0%</div>
          <div class="badge" id="badge" aria-hidden="true"></div>
        </div>
        <p class="verdict" id="verdict"></p>
        <p class="stats" id="stats"></p>
        <button id="btn-sticker" class="btn btn-sticker" type="button" disabled>✨ Make sticker</button>
        <div class="save-row">
          <button id="btn-dl-drawing" class="btn btn-small" type="button" disabled>⬇ Drawing</button>
          <button id="btn-dl-card" class="btn btn-small" type="button" disabled>⬇ Result card</button>
        </div>
        <button id="btn-again" class="btn btn-primary" type="button">Play again</button>
        <div id="debug" class="debug" hidden></div>
      </div>
    </aside>
  </main>

  <dialog id="sticker-dialog" class="sheet" aria-labelledby="sticker-title">
    <form method="dialog" class="sheet-close-form">
      <button class="sheet-close" aria-label="Close">✕</button>
    </form>
    <h2 id="sticker-title" class="sheet-title">Your sticker</h2>
    <div class="sticker-stage" id="sticker-stage" data-bg="checker">
      <img id="sticker-img" alt="Your drawing as a sticker" width="512" height="512">
    </div>
    <div class="bg-switch" role="radiogroup" aria-label="Preview background">
      <button type="button" role="radio" data-bg="checker" aria-checked="true">Clear</button>
      <button type="button" role="radio" data-bg="dark" aria-checked="false">Dark chat</button>
      <button type="button" role="radio" data-bg="light" aria-checked="false">Light chat</button>
    </div>
    <div class="sheet-actions">
      <button id="btn-dl-sticker" class="btn btn-primary" type="button">⬇ Download sticker</button>
    </div>
    <p class="sheet-note">512×512 PNG with a transparent background.</p>
  </dialog>

  <dialog id="cat-dialog" class="sheet" aria-labelledby="cat-title">
    <form method="dialog" class="sheet-close-form">
      <button class="sheet-close" aria-label="Close">✕</button>
    </form>
    <h2 id="cat-title" class="sheet-title">What do you want to draw?</h2>
    <div class="cat-grid" id="cat-grid"></div>
    <p class="sheet-note" id="cat-file-note" hidden>
      🖼️ Pictures need the game to run from a local server, e.g. <code>python -m http.server</code>.
    </p>
    <div class="cat-footer">
      <span class="cat-pool" id="cat-pool"></span>
      <button id="cat-all" class="btn btn-small" type="button">All on</button>
    </div>
    <form method="dialog">
      <button class="btn btn-primary cat-go">Let's draw!</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
